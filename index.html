<html lang="zh-CN">
<head>

<meta name="apple-mobile-web-app-title" content="厨房助手">
<meta name="mobile-web-app-capable" content="yes">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#1a1a1a;--surface2:#242424;--border:#333;
  --text:#e0e0e0;--text2:#999;--text3:#666;
  --accent:#ff6b35;--green:#2d8a4e;--green-bg:#0f2616;--yellow:#d49a00;--yellow-bg:#241e08;--red:#c84040;--red-bg:#2a1010;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;padding-bottom:70px}

/* ─── 顶部搜索 ─── */
.top-bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 12px 6px}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border);transition:border-color .2s}
.search-wrap:focus-within{border-color:var(--accent)}
.search-wrap input{flex:1;background:none;border:none;color:var(--text);font-size:16px;outline:none;min-width:0}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{font-size:16px;flex-shrink:0;color:var(--text3)}
.clear-btn{font-size:16px;cursor:pointer;color:var(--text3);display:none;flex-shrink:0;line-height:1}
.clear-btn:active{color:var(--text)}

/* ─── 分类标签 ─── */
.cat-scroll{display:flex;gap:6px;padding:6px 12px 8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{padding:6px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;flex-shrink:0;transition:all .15s;user-select:none}
.cat-chip:active{transform:scale(.95)}
.cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-tag{color:var(--yellow)}
.cat-tag.active{background:var(--yellow);color:#000;border-color:var(--yellow)}

/* ─── 统计信息 ─── */
.result-count{padding:0 12px 6px;font-size:12px;color:var(--text3)}

/* ─── 菜谱网格 ─── */
.grid{padding:0 8px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .15s;user-select:none;position:relative}
.recipe-card:active{transform:scale(.97);background:var(--surface2)}
.recipe-card .emoji{font-size:32px;display:block;margin-bottom:4px}
.recipe-card .r-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipe-card .r-meta{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px 8px}
.recipe-card .r-meta .diff{color:var(--yellow)}
.recipe-card .r-meta .time{color:var(--accent)}
.recipe-card .r-method{font-size:11px;color:var(--text2);margin-top:4px}

/* ─── 无结果 ─── */
.no-result{text-align:center;padding:60px 20px;color:var(--text3);grid-column:1/-1}
.no-result .big{font-size:48px;display:block;margin-bottom:10px}
.no-result .sub{font-size:13px;color:var(--text3);margin-top:4px}

/* ─── 底部 ─── */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--bg);border-top:1px solid var(--border);padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.combo-btn{width:100%;padding:13px;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--border);color:var(--text2);font-size:15px;cursor:pointer;transition:all .15s;text-align:center}
.combo-btn:active{background:var(--surface2);border-color:var(--accent);color:var(--accent)}
.combo-btn .icon{font-size:16px}

/* ─── 详情覆盖层 ─── */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom);display:none}
.overlay.open{display:block}
.overlay-header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.overlay-back{background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;padding:4px 8px;flex-shrink:0;font-weight:600}
.overlay-back:active{opacity:.7}
.overlay-title{font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay-body{padding:14px;max-width:640px;margin:0 auto}

/* ─── 菜谱元信息 ─── */
.recipe-meta{display:flex;flex-wrap:wrap;gap:8px 14px;background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:16px;border:1px solid var(--border)}
.recipe-meta .meta-item{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:4px}
.recipe-meta .meta-item .val{color:var(--text)}
.recipe-meta .tags-row{width:100%;display:flex;gap:4px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.recipe-meta .mini-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text2)}
.recipe-meta .mini-tag.ing{color:var(--accent);border:1px solid var(--accent);background:transparent}
.recipe-meta .mini-tag.tool{color:var(--green);border:1px solid var(--green);background:transparent}

/* ─── 调味料 ─── */
.seasoning-section{margin-bottom:16px}
.seasoning-section h3{font-size:13px;color:var(--text2);margin-bottom:6px}
.seasoning-list{display:flex;flex-wrap:wrap;gap:4px}
.seasoning-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.seasoning-chip.req{border-color:var(--accent);color:var(--text)}
.seasoning-chip .alt{color:var(--text3);font-size:11px;margin-left:4px}

/* ─── 步骤 ─── */
.steps-section{margin-bottom:16px}
.steps-section h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text)}
.step-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.step-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step-num{background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.step-name{font-size:15px;font-weight:600}
.step-duration{font-size:12px;color:var(--text3);margin-left:auto;flex-shrink:0}
.step-instr{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:8px;padding-left:34px}
.step-judge{font-size:13px;color:var(--green);background:var(--green-bg);padding:8px 12px;border-radius:var(--radius-sm);margin:0 0 6px 34px;line-height:1.5}
.step-judge::before{content:"✅ ";font-size:12px}
.step-novice{font-size:13px;color:var(--yellow);background:var(--yellow-bg);padding:8px 12px;border-radius:var(--radius-sm);margin:0 0 0 34px;line-height:1.5}
.step-novice::before{content:"💡 ";font-size:12px}

/* ─── 搞砸补救 ─── */
.rescue-section{margin-bottom:16px}
.rescue-section h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--red)}
.rescue-card{background:var(--red-bg);border:1px solid #3a1a1a;border-radius:var(--radius);padding:12px;margin-bottom:8px}
.rescue-problem{font-size:13px;color:var(--red);margin-bottom:4px;font-weight:600}
.rescue-fix{font-size:13px;color:var(--text2);line-height:1.5;padding-left:14px}

/* ─── 小贴士 ─── */
.tips-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.tips-section h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--yellow)}
.tips-section .txt{font-size:14px;color:var(--text2);line-height:1.6}

/* ─── 组合模式覆盖层 ─── */
.combo-overlay{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom);display:none}
.combo-overlay.open{display:block}
.combo-header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.combo-header h2{font-size:18px}
.combo-body{padding:14px;max-width:640px;margin:0 auto}
.combo-hint{font-size:13px;color:var(--text3);margin-bottom:12px}
.combo-ing-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.combo-ing-chip{padding:8px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;user-select:none}
.combo-ing-chip:active{transform:scale(.95)}
.combo-ing-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.combo-count{font-size:12px;color:var(--text3);margin-bottom:8px}
.combo-result-title{font-size:14px;font-weight:600;margin:12px 0 8px;color:var(--text)}
.combo-result{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

/* ─── PWA splash ─── */
@media(display-mode:standalone){body{padding-top:0}}
</style>
</head>
<body>

<!-- 顶部搜索 -->
<div class="top-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜食材、菜名..." autocomplete="off">
    <span class="clear-btn" id="clearBtn">✕</span>
  </div>
</div>

<!-- 分类标签 -->
<div class="cat-scroll" id="catBar"></div>

<!-- 统计 -->
<div class="result-count" id="resultCount"></div>

<!-- 菜谱网格 -->
<div class="grid" id="recipeGrid"></div>

<!-- 底部组合模式入口 -->
<div class="bottom-bar">
  <button class="combo-btn" id="comboBtn"><span class="icon">🥘</span> 组合模式 — 选食材，看能做什么菜</button>
</div>

<!-- 菜谱详情覆盖层 -->
<div class="overlay" id="detailOverlay">
  <div class="overlay-header">
    <button class="overlay-back" id="detailBack">← 返回</button>
    <span class="overlay-title" id="detailTitle">菜名</span>
  </div>
  <div class="overlay-body" id="detailBody"></div>
</div>

<!-- 组合模式覆盖层 -->
<div class="combo-overlay" id="comboOverlay">
  <div class="combo-header">
    <h2>🥘 组合模式</h2>
    <button class="overlay-back" id="comboBack">← 返回</button>
  </div>
  <div class="combo-body">
    <div class="combo-hint">选 2~5 种冰箱里有的食材，看看能做什么菜</div>
    <div class="combo-ing-grid" id="comboIngGrid"></div>
    <div class="combo-count" id="comboCount">已选 0 种食材</div>
    <div class="combo-result-title" id="comboResultTitle" style="display:none">🎯 可以做的菜：</div>
    <div class="combo-result" id="comboResult"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// 菜谱数据
// ═══════════════════════════════════════════
const RECIPES = [
  {
    id:'suan-rong-xi-lan-hua',
    name:'蒜蓉西兰花',
    emoji:'🥦',
    difficulty:1,
    time:12,
    cookMethod:'煮+淋油',
    category:'蔬菜',
    tags:['快手','下饭'],
    tools:['煮锅','炒勺'],
    mainIngredients:['西兰花'],
    subIngredients:['大蒜'],
    seasonings:[
      {name:'生抽',required:true},
      {name:'蚝油',required:false,alt:'不放也行，少点鲜味'},
      {name:'食用油',required:true},
    ],
    steps:[
      {stepNum:1,title:'切西兰花',duration:3,emoji:'🔪',instruction:'西兰花花朝上梗朝下，从花蕾中间切下去分成小朵。每朵乒乓球大小。梗去皮切片，筷子尖厚。',judge:'每朵大小均匀，梗片筷子尖厚。切完桌上没有满桌碎屑。',noviceNote:'花蕾切太小会掉碎屑到处都是——用刀尖先划一个口子再掰开'},
      {stepNum:2,title:'煮西兰花',duration:3,emoji:'🍲',instruction:'锅中加水烧开，加一小撮盐和几滴油。放入西兰花，大火煮3分钟。',judge:'筷子戳茎部能轻松戳透。花蕾颜色鲜亮翠绿。',noviceNote:'水没大开就下锅，煮出来是黄的不是绿的。一定要等水翻滚冒大泡再下锅'},
      {stepNum:3,title:'调蒜蓉酱',duration:1,emoji:'🧄',instruction:'大蒜切成蒜末，放在碗里。加2勺生抽、半勺蚝油（有就加）。',judge:'蒜末均匀，酱汁颜色一致。',noviceNote:'蒜末大小不一→大的生小的糊。尽量切均匀'},
      {stepNum:4,title:'淋油激香',duration:1,emoji:'🔥',instruction:'煮好的西兰花捞出装盘。锅烧干倒2勺油，烧到油面微微冒烟（约30秒）。关火，把热油淋在蒜末上。',judge:'听到滋啦一声，闻到蒜香。蒜末微微金黄。',noviceNote:'油不够热淋上去没声音——生蒜味冲。油一定要烧到冒烟才关火'},
    ],
    rescue:[
      {problem:'花蕾黄了散了煮过头',fix:'还是能吃的，当蒜蓉西兰花泥吃吧。下次水开后煮2分钟就捞'},
      {problem:'淋油没听到滋啦声（油不够热）',fix:'没关系，生蒜味冲一点但也能吃。下次油再烧10秒'},
      {problem:'蒜末炸糊了变黑',fix:'把糊的挑出来丢掉，剩下的能用。下次关火后再淋'},
    ],
    tips:'西兰花梗别扔！去皮切片一起煮，比花蕾还好吃。',
  },
  {
    id:'fan-qie-chao-dan',
    name:'番茄炒蛋',
    emoji:'🍅',
    difficulty:1,
    time:10,
    cookMethod:'炒',
    category:'禽蛋',
    tags:['快手','下饭','懒人'],
    tools:['炒锅','炒勺'],
    mainIngredients:['番茄','鸡蛋'],
    subIngredients:['葱'],
    seasonings:[
      {name:'盐',required:true},
      {name:'糖',required:false,alt:'不放也行，番茄酸的话加一点'},
      {name:'食用油',required:true},
    ],
    steps:[
      {stepNum:1,title:'切番茄',duration:2,emoji:'🔪',instruction:'番茄去蒂，切成麻将牌大小的块。不去皮，煮了皮自己会脱落。',judge:'块大小均匀，番茄汁没挤得到处都是。',noviceNote:'切太碎炒出来成番茄酱了——麻将牌大小刚好'},
      {stepNum:2,title:'打蛋',duration:1,emoji:'🥚',instruction:'鸡蛋打碗里，加一小撮盐，用筷子搅匀。搅到筷子挑起来没有蛋清丝。',judge:'蛋液均匀一色，没有透明蛋清团。',noviceNote:'不搅匀炒出来一块白一块黄——多搅20秒'},
      {stepNum:3,title:'炒蛋',duration:2,emoji:'🍳',instruction:'锅烧热倒油，油微冒烟（约20秒）倒入蛋液。等底部凝固了再用铲子推，炒到刚熟就盛出来。',judge:'蛋块嫩黄，还带一点湿润感，不是干巴巴的。',noviceNote:'蛋下锅就急着翻——变成炒蛋碎。等底部凝固了再轻轻推'},

      {stepNum:5,title:'合炒',duration:2,emoji:'🔄',instruction:'把炒好的蛋倒回锅里，和番茄一起翻炒几下。让蛋块裹上番茄汁。加一小撮糖提鲜。',judge:'蛋块均匀裹上红色汤汁，每一块都有味道。',noviceNote:'倒回去又炒很久——蛋会变老。翻匀就出锅，10秒搞定'},

      {problem:'番茄不出汁，炒了半天还是硬的',fix:'番茄本身不够熟。加一小勺水盖盖子焖1分钟，用铲子压一压'},
      {problem:'炒出来水汪汪的',fix:'正常！番茄汁多。大火收一下汁就好。下次选摸起来有点软的番茄'},

    tips:'这道菜没有固定公式——甜口多加糖，咸口多加盐。先做一次找到自己的口味。',

  {

    emoji:'🍗',

    category:'肉类',
    tags:['下饭','解馋'],
    tools:['炒锅','锅盖'],
    mainIngredients:['鸡翅'],
    subIngredients:['姜'],
    seasonings:[
      {name:'可乐',required:true},
      {name:'生抽',required:true},
      {name:'老抽',required:false,alt:'没有的话颜色浅一点但味道一样好'},
      {name:'料酒',required:false,alt:'用姜片代替去腥也行'},
      {name:'食用油',required:true},
    ],
    steps:[

      {stepNum:3,title:'加料炖煮',duration:15,emoji:'🍲',instruction:'倒入可乐，没过鸡翅大半。加2勺生抽、半勺老抽（有就加）、姜片。大火烧开转中小火，盖盖子炖15分钟。',judge:'汤汁变浓稠，鸡翅颜色红亮。筷子能轻松戳透。',noviceNote:'可乐倒太多会太甜——没过鸡翅大半就够了，不是一整瓶'},
      {stepNum:4,title:'收汁',duration:3,emoji:'🔥',instruction:'开盖转大火收汁，用铲子翻动防止粘锅。收到汤汁浓稠裹在鸡翅上。',judge:'汤汁变浓稠像糖浆一样挂在勺子上。冒大泡泡就要关火。',noviceNote:'收到干了糊锅——留一点汤汁拌饭超香。看到大泡泡变密集了就关火'},
    ],
    rescue:[
      {problem:'鸡翅煎糊了',fix:'把黑的部分刮掉继续炖。下次用中小火，油热了再下锅'},
      {problem:'太甜了吃不惯',fix:'加半勺生抽或一点点醋平衡甜味。下次可乐少倒1/3，加点水'},
      {problem:'没炖烂咬不动',fix:'再炖10分钟，筷子戳一下。鸡翅一般15分钟肯定熟了'},
    ],
    tips:'剩下的汤汁别倒！拌米饭或者煮面条绝了。',
  },
];

// ═══════════════════════════════════════════
// 分类系统
// ═══════════════════════════════════════════
const CATEGORIES = [
  {key:'all',label:'全部',type:'all'},
  {key:'蔬菜',label:'蔬菜',type:'category'},
  {key:'肉类',label:'肉类',type:'category'},
  {key:'禽蛋',label:'禽蛋',type:'category'},
  {key:'水产',label:'水产',type:'category'},
  {key:'菌菇',label:'菌菇',type:'category'},
  {key:'豆制品',label:'豆制品',type:'category'},
  {key:'主食',label:'主食',type:'category'},
  {key:'快手',label:'快手',type:'tag'},
  {key:'下饭',label:'下饭',type:'tag'},
  {key:'懒人',label:'懒人',type:'tag'},
  {key:'空气炸锅',label:'空气炸锅',type:'tag'},
];

// 用于组合模式的所有食材集合
function getAllIngredients(){
  const set = new Set();
  RECIPES.forEach(r=>{
    r.mainIngredients.forEach(i=>set.add(i));
    r.subIngredients.forEach(i=>set.add(i));
  });
  return [...set].sort();
}

// ═══════════════════════════════════════════
// DOM 引用
// ═══════════════════════════════════════════
const $search = document.getElementById('searchInput');
const $clear = document.getElementById('clearBtn');
const $catBar = document.getElementById('catBar');
const $count = document.getElementById('resultCount');
const $grid = document.getElementById('recipeGrid');
const $detailOverlay = document.getElementById('detailOverlay');
const $detailBack = document.getElementById('detailBack');
const $detailTitle = document.getElementById('detailTitle');
const $detailBody = document.getElementById('detailBody');
const $comboBtn = document.getElementById('comboBtn');
const $comboOverlay = document.getElementById('comboOverlay');
const $comboBack = document.getElementById('comboBack');
const $comboIngGrid = document.getElementById('comboIngGrid');
const $comboCount = document.getElementById('comboCount');
const $comboResult = document.getElementById('comboResult');
const $comboResultTitle = document.getElementById('comboResultTitle');

// ═══════════════════════════════════════════
// 状态
// ═══════════════════════════════════════════
let activeCat = 'all';
let searchQuery = '';
let comboSelected = new Set();

// ═══════════════════════════════════════════
// 渲染分类
// ═══════════════════════════════════════════
function renderCats(){
  $catBar.innerHTML = CATEGORIES.map(c=>{
    const isTag = c.type==='tag';
    return `<div class="cat-chip${c.key===activeCat?' active':''}${isTag?' cat-tag':''}" data-key="${c.key}">${c.label}</div>`;
  }).join('');
}

function setCat(key){
  activeCat = key;
  renderCats();
  renderGrid();
}

// ═══════════════════════════════════════════
// 过滤菜谱
// ═══════════════════════════════════════════
function filterRecipes(){
  let list = RECIPES;

  if(activeCat !== 'all'){
    const cat = CATEGORIES.find(c=>c.key===activeCat);
    if(cat){
      if(cat.type === 'category'){
        list = list.filter(r=>r.category===activeCat);
      }else if(cat.type === 'tag'){
        list = list.filter(r=>r.tags.includes(activeCat));
      }
    }
  }

  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(r=>{
      return r.name.includes(q) ||
        r.mainIngredients.some(i=>i.includes(q)) ||
        r.subIngredients.some(i=>i.includes(q)) ||
        r.tags.some(t=>t.includes(q)) ||
        r.cookMethod.includes(q) ||
        r.tools.some(t=>t.includes(q));
    });
  }

  return list;
}

// ═══════════════════════════════════════════
// 渲染菜谱网格
// ═══════════════════════════════════════════
function starStr(d){
  return '★'.repeat(d)+'☆'.repeat(3-d);
}

function renderGrid(){
  const list = filterRecipes();

  $count.textContent = `共 ${list.length} 道菜`;

  if(!list.length){
    $grid.innerHTML = `<div class="no-result"><span class="big">🔍</span>没找到匹配的菜谱<div class="sub">试试其他食材或换个分类</div></div>`;
    return;
  }

  $grid.innerHTML = list.map(r=>`
    <div class="recipe-card" data-id="${r.id}">
      <span class="emoji">${r.emoji}</span>
      <div class="r-name">${r.name}</div>
      <div class="r-meta">
        <span class="diff">${starStr(r.difficulty)}</span>
        <span class="time">⏱${r.time}分</span>
      </div>
      <div class="r-method">${r.cookMethod}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
// 渲染详情
// ═══════════════════════════════════════════
function openDetail(id){
  const recipe = RECIPES.find(r=>r.id===id);
  if(!recipe) return;

  $detailTitle.textContent = recipe.emoji+' '+recipe.name;

  let html = '';

  // 元信息
  html += `<div class="recipe-meta">`;
  html += `<div class="meta-item">⭐ 难度 <span class="val">${starStr(recipe.difficulty)}</span></div>`;
  html += `<div class="meta-item">⏱ 时间 <span class="val">${recipe.time}分钟</span></div>`;
  html += `<div class="meta-item">🍳 做法 <span class="val">${recipe.cookMethod}</span></div>`;
  if(recipe.tools && recipe.tools.length){
    html += `<div class="meta-item">🔧 工具 <span class="val">${recipe.tools.join('、')}</span></div>`;
  }
  // 主料
  html += `<div class="tags-row">`;
  recipe.mainIngredients.forEach(ing=>{
    html += `<span class="mini-tag ing">${ing}</span>`;
  });
  recipe.subIngredients.forEach(ing=>{
    html += `<span class="mini-tag">${ing}</span>`;
  });
  recipe.tools.forEach(t=>{
    html += `<span class="mini-tag tool">${t}</span>`;
  });
  html += `</div></div>`;

  // 调味料
  if(recipe.seasonings && recipe.seasonings.length){
    html += `<div class="seasoning-section"><h3>🧂 调味料</h3><div class="seasoning-list">`;
    recipe.seasonings.forEach(s=>{
      html += `<span class="seasoning-chip${s.required?' req':''}">${s.name}${s.required?' (必需)':''}${s.alt?' <span class="alt">· '+s.alt+'</span>':''}</span>`;
    });
    html += `</div></div>`;
  }

  // 步骤
  html += `<div class="steps-section"><h3>📝 步骤</h3>`;
  recipe.steps.forEach(s=>{
    html += `<div class="step-card">`;
    html += `<div class="step-header"><span class="step-num">${s.stepNum}</span><span class="step-name">${s.emoji} ${s.title}</span><span class="step-duration">${s.duration}分钟</span></div>`;
    html += `<div class="step-instr">${s.instruction}</div>`;
    html += `<div class="step-judge">${s.judge}</div>`;
    if(s.noviceNote) html += `<div class="step-novice">${s.noviceNote}</div>`;
    html += `</div>`;
  });
  html += `</div>`;

  // 搞砸补救
  if(recipe.rescue && recipe.rescue.length){
    html += `<div class="rescue-section"><h3>🆘 搞砸了怎么办</h3>`;
    recipe.rescue.forEach(r=>{
      html += `<div class="rescue-card"><div class="rescue-problem">❌ ${r.problem}</div><div class="rescue-fix">→ ${r.fix}</div></div>`;
    });
    html += `</div>`;
  }

  // 小贴士
  if(recipe.tips){
    html += `<div class="tips-section"><h3>💡 小贴士</h3><div class="txt">${recipe.tips}</div></div>`;
  }

  $detailBody.innerHTML = html;
  $detailOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  $detailOverlay.scrollTop = 0;
}

function closeDetail(){
  $detailOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════
// 组合模式
// ═══════════════════════════════════════════
function openCombo(){
  comboSelected = new Set();
  renderComboIngs();
  renderComboResult();
  $comboOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  $comboOverlay.scrollTop = 0;
}

function closeCombo(){
  $comboOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

function toggleComboIng(name){
  if(comboSelected.has(name)){
    comboSelected.delete(name);
  }else{
    if(comboSelected.size >= 5) return;
    comboSelected.add(name);
  }
  renderComboIngs();
  renderComboResult();
}

function renderComboIngs(){
  const allIngs = getAllIngredients();
  $comboIngGrid.innerHTML = allIngs.map(name=>`
    <div class="combo-ing-chip${comboSelected.has(name)?' selected':''}" data-ing="${name}">${name}</div>
  `).join('');
  $comboCount.textContent = `已选 ${comboSelected.size} 种食材（选 2～5 种）`;
}

function renderComboResult(){
  if(comboSelected.size < 2){
    $comboResultTitle.style.display = 'none';
    $comboResult.innerHTML = '';
    return;
  }
  const sels = [...comboSelected];
  const matched = RECIPES.filter(r=>{
    const allIngs = [...r.mainIngredients, ...r.subIngredients];
    return sels.every(s=>allIngs.some(i=>i.includes(s)||s.includes(i)));
  });

  if(!matched.length){
    $comboResultTitle.style.display = 'block';
    $comboResultTitle.textContent = '😅 没找到同时包含这些食材的菜谱，试试换几种食材';
    $comboResult.innerHTML = '';
    return;
  }

  $comboResultTitle.style.display = 'block';
  $comboResultTitle.textContent = `🎯 找到 ${matched.length} 道菜：`;
  $comboResult.innerHTML = matched.map(r=>`
    <div class="recipe-card" data-id="${r.id}">
      <span class="emoji">${r.emoji}</span>
      <div class="r-name">${r.name}</div>
      <div class="r-meta">
        <span class="diff">${starStr(r.difficulty)}</span>
        <span class="time">⏱${r.time}分</span>
      </div>
      <div class="r-method">${r.cookMethod}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
// 事件绑定（事件代理）
// ═══════════════════════════════════════════

// 分类点击
$catBar.addEventListener('click',e=>{
  const chip = e.target.closest('.cat-chip');
  if(chip) setCat(chip.dataset.key);
});

// 菜谱卡片点击 → 打开详情
$grid.addEventListener('click',e=>{
  const card = e.target.closest('.recipe-card');
  if(card) openDetail(card.dataset.id);
});

// 详情覆盖层
$detailBack.addEventListener('click',closeDetail);

// 组合模式
$comboBtn.addEventListener('click',openCombo);
$comboBack.addEventListener('click',closeCombo);

// 组合模式食材选择
$comboIngGrid.addEventListener('click',e=>{
  const chip = e.target.closest('.combo-ing-chip');
  if(chip) toggleComboIng(chip.dataset.ing);
});

// 组合模式结果点击
$comboResult.addEventListener('click',e=>{
  const card = e.target.closest('.recipe-card');
  if(card){
    closeCombo();
    openDetail(card.dataset.id);
  }
});

// 搜索
$search.addEventListener('input',()=>{
  searchQuery = $search.value.trim();
  $clear.style.display = searchQuery ? 'block' : 'none';
  renderGrid();
});

$clear.addEventListener('click',()=>{
  $search.value = '';
  searchQuery = '';
  $clear.style.display = 'none';
  renderGrid();
});

// ESC 关闭覆盖层
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($detailOverlay.classList.contains('open')) closeDetail();
    if($comboOverlay.classList.contains('open')) closeCombo();
  }
});

// ═══════════════════════════════════════════
// Service Worker 注册
// ═══════════════════════════════════════════
function registerSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      console.log('SW registered:', reg.scope);
    }).catch(err=>{
      console.log('SW registration failed:', err);
    });
  }
}
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
  registerSW();
}

// ═══════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════
renderCats();
renderGrid();
</script>
</body>
</html>
